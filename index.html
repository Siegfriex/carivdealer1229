<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForwardMax | B2B 중고차 수출 플랫폼</title>
  </head>
  <body>
    <!-- Mobile Blocker (700px 미만에서만 표시) -->
    <div id="mobile-blocker">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; background-color: #F8F9FA;">
        <div style="text-center; max-width: 28rem;">
          <h1 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem; color: #111827;">데스크톱에서 접속해주세요</h1>
          <p style="color: #4B5563; line-height: 1.75;">
            본 서비스는 데스크톱 환경에 최적화되어 있습니다.<br />
            PC나 태블릿(가로 모드)에서 접속해주세요.
          </p>
          <p style="font-size: 0.875rem; color: #6B7280; margin-top: 1rem;">
            최소 권장 해상도: 700px × 600px
          </p>
        </div>
      </div>
    </div>

    <!-- Main Application (700px 이상) -->
    <div id="root"></div>
    
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
